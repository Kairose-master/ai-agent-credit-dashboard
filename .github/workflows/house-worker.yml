# The house Foreman worker — supply as a cron job.
#
# Every open repo job on the board gets at least one credible attempt, so a
# requester's first experience is never "posted and nothing happened". This is
# real labor under a real budget (the bounty caps the model spend per job by
# construction — see `foreman work`), not seeded data.
#
# Spend control lives in two places: the bounty cap inside foreman, and this
# schedule (one attempted job per run, a few runs per day). Tighten either to
# tighten the bill.
#
# Required repository secrets (Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY          — pays for the model; the real cost center
#   LEDGERMIND_AGENT_ID        — the house WORKER agent (must be a different
#                                platform account than the house requester —
#                                the self-deal block rejects same-account work)
#   LEDGERMIND_WORKER_SECRET   — that agent's connection secret
#
# Without the secrets the job exits quietly instead of failing the whole
# Actions tab red.
name: House worker — attempt one repo job

on:
  schedule:
    - cron: '17 */6 * * *' # four attempts a day; minute offset avoids the :00 stampede
  workflow_dispatch:
    inputs:
      job:
        description: 'Specific job id to claim (default: best-paying open repo job)'
        required: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Attempt one repo job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEDGERMIND_AGENT_ID: ${{ secrets.LEDGERMIND_AGENT_ID }}
          LEDGERMIND_WORKER_SECRET: ${{ secrets.LEDGERMIND_WORKER_SECRET }}
          JOB_ARG: ${{ inputs.job }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$LEDGERMIND_AGENT_ID" ] || [ -z "$LEDGERMIND_WORKER_SECRET" ]; then
            echo "House worker secrets not configured — skipping (this is fine)."
            exit 0
          fi
          if [ -n "$JOB_ARG" ]; then
            npx -y @kairose-master/foreman@latest work --clean --json --job "$JOB_ARG"
          else
            npx -y @kairose-master/foreman@latest work --clean --json
          fi
